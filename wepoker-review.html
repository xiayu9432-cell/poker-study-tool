<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>德州扑克训练控制台</title><link rel="stylesheet" href="wepoker-review.css"></head>
<body><main class="console">
<header><div><small>输出板块</small><h1>训练控制台</h1></div><span id="status" class="status">等待识别</span></header>
<section class="controls"><button id="captureBtn">启动识别</button><button id="captureLockBtn">锁定采集框</button><button id="auditBtn">关闭采集审核台</button><button id="strategyModeBtn">自动基础与剥削</button><button id="dockBtn">解除吸附</button><button id="topmostBtn">取消置顶</button><button id="heroProfileBtn">查看我的范围</button><button id="opponentHandsBtn">查看对手范围</button></section>
<section class="panel table-cards"><div><span class="card-label">我的手牌</span><div id="heroCards" class="cards-row"><span class="cards-empty">等待识别</span></div></div><div><span class="card-label">公共牌</span><div id="boardCards" class="cards-row"><span class="cards-empty">翻牌前</span></div></div></section>
<section class="decision-card" title="只显示通过牌面、动作链、金额和合法按钮检查后的场景基础策略或正式收益比较结果"><span>当前训练建议</span><strong id="mainDecision">等待正式计算</strong><small id="confidenceInline">等待可靠数据</small><small id="alternativeDecision" class="alternative-decision" hidden></small><div id="raiseOptions" class="raise-options"></div></section>
<section class="panel strategy-contract-panel"><h2>策略路径</h2><div class="strategy-contract-grid"><span>场景基础策略<b id="baselineAction">等待</b></span><span>实时精算动作<b id="mathAction">等待</b></span><span>是否覆盖基础策略<b id="strategyOverride">等待</b></span><span>本手画像修正<b id="exploitStage">等待</b></span><span>精算输入状态<b id="inputReliability">等待</b></span><span>策略依据等级<b id="strategyEvidenceLevel">等待</b></span></div><small id="strategyDisagreement">尚未形成正式决策</small></section>
<section class="panel reasons"><h2 title="由本手真实位置、牌力、赔率、行动压力、对手范围和有效筹码生成">为什么这样行动</h2><ol id="decisionReasons"><li>等待本人正式行动按钮</li></ol></section>
<section class="math-grid"><article title="根据本人手牌、公共牌和仍在局对手推定范围计算的获胜概率"><span>估计胜率</span><b id="equity">--</b></article><article title="翻前显示未扣抽成的即时底池赔率门槛；翻后只有抽成已确认时才计入抽成"><span>继续所需胜率</span><b id="required">--</b></article><article title="只有正式收益比较实际运行后才显示；基础策略单独给出动作时显示空值"><span>模型估算收益</span><b id="ev">--</b></article></section>
<div hidden><div id="ranges"></div><div id="rangeV2Status"></div><div id="purpose"></div><div id="risk"></div><div id="confidence"></div><div id="decisionInputs"></div><div id="spr"></div><div id="advicePhase"></div><div id="strategyLatency"></div><div id="cardLatency"></div><div id="boxState"></div><div id="actionLog"></div><div id="seatDiagnostics"></div><div id="heroEvidence"></div><div id="historyStatus"></div><div id="strategySource"></div><div id="solverStatus"></div></div>
</main><script src="preflop-participation.js"></script><script src="poker-core.js"></script><script src="postflop-scene-recognizer.js"></script><script src="v2-model.js"></script><script src="decision-layer.js"></script><script src="presentation-layer.js"></script><script src="v4-strategy-safety.js"></script><script src="wepoker-review.js"></script></body></html>
