<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>训练辅助面板</title><link rel="stylesheet" href="training-support.css"></head>
<body><main><header><div><small>控制台外侧独立窗口</small><h1>训练辅助面板</h1></div><span id="status">等待连接</span></header>
<section id="exploitRadar" class="panel exploit-radar baseline"><h2>弱手雷达</h2><strong id="exploitRadarTitle">稳健基础策略</strong><div id="exploitRadarEvidence">尚未发现达到样本门槛的明确弱点</div><small id="exploitRadarAction">继续观察；没有可靠目标时不启用个体剥削。</small></section>
<section id="peekRecommendation" class="peek-recommendation pending" title="这里只按对手样本缺口提示信息用途，尚未计算公开信息价值是否超过费用；不会自动点击"><b>偷偷看信息提示</b><strong id="peekRecommendationTitle">等待本手结算</strong><span id="peekRecommendationText">只在按钮可用时提示信息缺口，不代表已经计算费用收益。</span></section>
<section class="panel profile-capture"><h2>手动采集玩家资料</h2><div class="profile-capture-body"><button id="profileCaptureBtn" disabled>显示下一条</button><span id="profileCaptureStatus">点击玩家头像后自动采集；核对黄色弹窗资料后点击对应座位卡片</span><label>确认姓名 <input id="profileNameInput" maxlength="40" placeholder="识别不准时可直接修改"></label><span id="profileCaptured">已采集：无</span><span id="profileMissing">未采集：等待玩家名单</span><div id="profileSeatChoices" class="seat-choices"></div></div></section>
<section id="equityDecision" class="panel equity-decision waiting"><h2>有效权益判断</h2><strong id="equityDecisionComparison">等待本人需要抉择</strong><div id="equityDecisionConclusion">正式精算完成后自动显示</div><small id="equityDecisionReasons">输入未齐全时不显示未经验证的结论</small></section>
</main><script src="poker-core.js"></script><script src="training-support.js"></script></body></html>
